<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configplist OptiSystem⚡️ - Master</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" id="app">
        <div class="header">
            <div class="icon">👑</div>
            <h1>Configplist OptiSystem⚡️</h1>
            <div class="sub">Master Panel</div>
        </div>

        <!-- LOGIN -->
        <div id="login-box">
            <div class="form-group">
                <label>👤 Master Username</label>
                <input type="text" id="masterUser" placeholder="Enter username..." value="nguyenduclam">
            </div>
            <div class="form-group">
                <label>🔑 Master Password</label>
                <input type="password" id="masterPass" placeholder="Enter password..." onkeydown="if(event.key==='Enter') masterLogin()">
            </div>
            <button class="btn" onclick="masterLogin()">Login</button>
            <div id="loginMsg" class="msg"></div>
        </div>

        <!-- DASHBOARD -->
        <div id="dashboard" class="hidden">
            <div style="display:flex;justify-content:space-between;margin-bottom:16px;">
                <span style="font-size:14px;color:rgba(255,255,255,0.4);">Total Admins: <strong id="totalAdmins" style="color:#ff6b6b;">0</strong></span>
                <span style="font-size:14px;color:rgba(255,255,255,0.4);">Total Keys: <strong id="totalKeys" style="color:#ff6b6b;">0</strong></span>
            </div>

            <!-- ===== TẠO KEY (THÊM MỚI) ===== -->
            <div style="border-top:1px solid rgba(255,255,255,0.05);padding-top:16px;">
                <h2 style="font-size:16px;color:#e0e0e0;margin-bottom:12px;">🔑 Create Key</h2>

                <div class="form-group">
                    <label>Package</label>
                    <select id="mPackageSelect">
                        <option value="vip">VIP</option>
                        <option value="gold">GOLD</option>
                        <option value="free">FREE</option>
                        <option value="premium">PREMIUM</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Expiry (days)</label>
                    <input type="number" id="mExpiryDays" value="365" min="1" max="9999">
                </div>

                <div class="form-group">
                    <label>Max Devices</label>
                    <input type="number" id="mMaxDevices" value="1" min="1" max="999">
                </div>

                <div style="font-size:13px;font-weight:600;color:rgba(255,255,255,0.6);margin:12px 0 4px;">Features</div>
                <div class="feature-grid">
                    <label><input type="checkbox" class="m-feature-chk" value="battery" checked> 🔋 Battery</label>
                    <label><input type="checkbox" class="m-feature-chk" value="fps_boost" checked> ⚡ FPS</label>
                    <label><input type="checkbox" class="m-feature-chk" value="reduce_lag" checked> 🌐 DNS</label>
                    <label><input type="checkbox" class="m-feature-chk" value="ad_block" checked> 🚫 AdBlock</label>
                    <label><input type="checkbox" class="m-feature-chk" value="network_optimize"> 📶 Wi-Fi</label>
                    <label><input type="checkbox" class="m-feature-chk" value="ram_clean"> 🧹 RAM</label>
                    <label><input type="checkbox" class="m-feature-chk" value="cache_clean"> 🗑️ Cache</label>
                    <label><input type="checkbox" class="m-feature-chk" value="head_track"> 🎯 Head</label>
                    <label><input type="checkbox" class="m-feature-chk" value="fix_recoil"> 🔫 Recoil</label>
                    <label><input type="checkbox" class="m-feature-chk" value="light_scope"> ⚖️ Scope</label>
                    <label><input type="checkbox" class="m-feature-chk" value="body_track"> 🎯 Body</label>
                </div>

                <div class="form-group">
                    <label>Custom DNS (1 per line)</label>
                    <textarea id="mCustomDns" rows="2" placeholder="1.1.1.1&#10;8.8.8.8"></textarea>
                </div>

                <button class="btn" onclick="masterCreateKey()">Create Key</button>
                <div id="mCreateMsg" class="msg"></div>
            </div>

            <!-- ===== TẠO ADMIN CON ===== -->
            <div style="border-top:1px solid rgba(255,255,255,0.05);padding-top:16px;">
                <h2 style="font-size:16px;color:#e0e0e0;margin-bottom:12px;">➕ Create Admin</h2>

                <div class="form-group">
                    <label>👤 Username</label>
                    <input type="text" id="newAdminUser" placeholder="VD: admin2">
                </div>
                <div class="form-group">
                    <label>🔑 Password</label>
                    <input type="text" id="newAdminPass" placeholder="Password for admin">
                </div>
                <div class="form-group">
                    <label>📛 Display Name</label>
                    <input type="text" id="newAdminName" placeholder="VD: Admin 2">
                </div>
                <div class="form-group">
                    <label>📱 Zalo</label>
                    <input type="text" id="newAdminZalo" placeholder="VD: 0879072010" value="0879072010">
                </div>
                <div class="form-group">
                    <label>📦 Key Quota</label>
                    <input type="number" id="newAdminQuota" value="50" min="1">
                </div>

                <button class="btn" onclick="createAdmin()">Create Admin</button>
                <div id="createMsg" class="msg"></div>
            </div>

            <!-- ===== DANH SÁCH KEY ===== -->
            <div class="key-list" style="margin-top:20px;">
                <h2 style="font-size:16px;color:#e0e0e0;margin-bottom:10px;">📋 All Keys</h2>
                <div id="mKeyList"></div>
            </div>

            <!-- ===== DANH SÁCH ADMIN ===== -->
            <div class="key-list" style="margin-top:20px;">
                <h2 style="font-size:16px;color:#e0e0e0;margin-bottom:10px;">📋 Admin List</h2>
                <div id="adminList"></div>
            </div>

            <div style="margin-top:16px;text-align:center;">
                <a href="#" onclick="masterLogout(); return false;" style="color:rgba(255,255,255,0.2);font-size:13px;text-decoration:none;">Logout</a>
            </div>
        </div>

        <div class="brand">CONFIGPLIST OPTISYSTEM ⚡️ · DUCLAM.NET</div>
    </div>

    <script>
        let masterToken = null;

        // ============================================================
        // MASTER LOGIN
        // ============================================================
        function masterLogin() {
            const username = document.getElementById('masterUser').value.trim();
            const password = document.getElementById('masterPass').value.trim();
            const msg = document.getElementById('loginMsg');

            if (!username || !password) {
                msg.className = 'msg error';
                msg.textContent = 'Please enter username and password!';
                return;
            }

            fetch('/api/master-login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username, password: password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    masterToken = username;
                    document.getElementById('login-box').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                    msg.className = 'msg';
                    msg.textContent = '';
                    loadAllKeys();
                    loadAdmins();
                } else {
                    msg.className = 'msg error';
                    msg.textContent = 'Invalid username or password!';
                }
            })
            .catch(() => {
                msg.className = 'msg error';
                msg.textContent = 'Connection error!';
            });
        }

        function masterLogout() {
            masterToken = null;
            document.getElementById('login-box').classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('masterPass').value = '';
        }

        // ============================================================
        // MASTER CREATE KEY (THÊM MỚI)
        // ============================================================
        function masterCreateKey() {
            const packageName = document.getElementById('mPackageSelect').value;
            const expiresDays = parseInt(document.getElementById('mExpiryDays').value) || 365;
            const maxDevices = parseInt(document.getElementById('mMaxDevices').value) || 1;
            const msg = document.getElementById('mCreateMsg');

            if (!masterToken) {
                msg.className = 'msg error';
                msg.textContent = 'Please login again!';
                return;
            }

            const features = {};
            document.querySelectorAll('.m-feature-chk:checked').forEach(chk => {
                features[chk.value] = true;
            });

            const dnsText = document.getElementById('mCustomDns').value.trim();
            const customDns = dnsText ? dnsText.split('\n').map(s => s.trim()).filter(s => s) : [];

            fetch('/api/create-key', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + masterToken
                },
                body: JSON.stringify({
                    package: packageName,
                    expiresDays: expiresDays,
                    maxDevices: maxDevices,
                    features: features,
                    customDns: customDns
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    msg.className = 'msg success';
                    msg.textContent = '✅ Key created: ' + data.key.keyCode;
                    loadAllKeys();
                } else {
                    msg.className = 'msg error';
                    msg.textContent = data.error || 'Error creating key!';
                }
            })
            .catch(() => {
                msg.className = 'msg error';
                msg.textContent = 'Connection error!';
            });
        }

        // ============================================================
        // MASTER DELETE KEY
        // ============================================================
        function masterDeleteKey(keyCode) {
            if (!confirm('Delete key ' + keyCode + '?')) return;

            fetch('/api/delete-key', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + masterToken
                },
                body: JSON.stringify({ keyCode: keyCode })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    loadAllKeys();
                } else {
                    alert(data.error || 'Error deleting key!');
                }
            })
            .catch(() => alert('Connection error!'));
        }

        // ============================================================
        // LOAD ALL KEYS
        // ============================================================
        function loadAllKeys() {
            if (!masterToken) return;

            fetch('/api/keys', {
                headers: { 'Authorization': 'Bearer ' + masterToken }
            })
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('mKeyList');

                // Cập nhật tổng key
                document.getElementById('totalKeys').textContent = data.keys ? data.keys.length : 0;

                if (!data.keys || data.keys.length === 0) {
                    container.innerHTML = '<div style="color:rgba(255,255,255,0.2);text-align:center;padding:20px;">No keys yet</div>';
                    return;
                }

                let html = '';
                data.keys.forEach(k => {
                    const isExpired = new Date(k.expiresAt) < new Date();
                    const statusClass = isExpired ? 'expired' : 'active';
                    const statusText = isExpired ? 'Expired' : 'Active';
                    const isFull = k.usedDevices.length >= k.maxDevices;
                    const fullText = isFull ? ' 🔴 Full' : '';

                    html += `
                    <div class="key-item">
                        <div>
                            <div class="code">${k.keyCode}</div>
                            <div style="font-size:11px;color:rgba(255,255,255,0.3);margin-top:2px;">
                                ${k.package.toUpperCase()} · ${k.usedDevices.length}/${k.maxDevices} devices${fullText}
                                · Expires: ${new Date(k.expiresAt).toLocaleDateString('vi-VN')}
                                · Created by: ${k.createdBy}
                            </div>
                        </div>
                        <div style="display:flex;align-items:center;gap:8px;">
                            <span class="status ${statusClass}">${statusText}</span>
                            <button class="delete-btn" onclick="masterDeleteKey('${k.keyCode}')" title="Delete key">🗑️</button>
                        </div>
                    </div>
                    `;
                });
                container.innerHTML = html;
            })
            .catch(() => {
                document.getElementById('mKeyList').innerHTML = '<div style="color:rgba(255,255,255,0.2);text-align:center;padding:20px;">Error loading keys</div>';
            });
        }

        // ============================================================
        // CREATE ADMIN
        // ============================================================
        function createAdmin() {
            const username = document.getElementById('newAdminUser').value.trim();
            const password = document.getElementById('newAdminPass').value.trim();
            const displayName = document.getElementById('newAdminName').value.trim();
            const zalo = document.getElementById('newAdminZalo').value.trim();
            const quota = parseInt(document.getElementById('newAdminQuota').value) || 50;
            const msg = document.getElementById('createMsg');

            if (!username || !password) {
                msg.className = 'msg error';
                msg.textContent = 'Username and password are required!';
                return;
            }

            fetch('/api/master-create-admin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    master_username: masterToken,
                    master_password: document.getElementById('masterPass').value,
                    username: username,
                    password: password,
                    displayName: displayName || username,
                    zalo: zalo || '0879072010',
                    keyQuota: quota
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    msg.className = 'msg success';
                    msg.textContent = '✅ Admin created: ' + username + ' (Quota: ' + quota + ')';
                    loadAdmins();
                    document.getElementById('newAdminUser').value = '';
                    document.getElementById('newAdminPass').value = '';
                    document.getElementById('newAdminName').value = '';
                    document.getElementById('newAdminZalo').value = '0879072010';
                    document.getElementById('newAdminQuota').value = '50';
                } else {
                    msg.className = 'msg error';
                    msg.textContent = data.error || 'Error creating admin!';
                }
            })
            .catch(() => {
                msg.className = 'msg error';
                msg.textContent = 'Connection error!';
            });
        }

        // ============================================================
        // LOAD ADMINS
        // ============================================================
        function loadAdmins() {
            if (!masterToken) return;

            fetch('/api/master-admins', {
                headers: { 'Authorization': 'Bearer ' + masterToken }
            })
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('adminList');
                document.getElementById('totalAdmins').textContent = data.admins.length;

                if (!data.admins || data.admins.length === 0) {
                    container.innerHTML = '<div style="color:rgba(255,255,255,0.2);text-align:center;padding:20px;">No admins</div>';
                    return;
                }

                let html = '';
                data.admins.forEach(a => {
                    const statusClass = a.isActive ? '' : 'inactive';
                    const statusText = a.isActive ? '🟢 Active' : '🔴 Locked';
                    const ipDisplay = a.registered_ip || '🔴 Not set';

                    html += `
                    <div class="admin-item">
                        <div>
                            <div class="name">${a.displayName || a.username}</div>
                            <div style="font-size:11px;color:rgba(255,255,255,0.3);">
                                ${a.username} · ${a.keysUsed || 0}/${a.keyQuota || 0} keys
                                · Zalo: ${a.zalo || 'N/A'}
                                · IP: ${ipDisplay}
                            </div>
                        </div>
                        <div style="display:flex;align-items:center;gap:8px;">
                            <span class="badge ${statusClass}">${statusText}</span>
                            <div class="actions">
                                <button onclick="editQuota('${a.username}')" title="Edit quota">✏️</button>
                                <button class="del" onclick="deleteAdmin('${a.username}')" title="Delete admin">🗑️</button>
                            </div>
                        </div>
                    </div>
                    `;
                });
                container.innerHTML = html;
            })
            .catch(() => {
                document.getElementById('adminList').innerHTML = '<div style="color:rgba(255,255,255,0.2);text-align:center;padding:20px;">Error loading admins</div>';
            });
        }

        // ============================================================
        // EDIT QUOTA
        // ============================================================
        function editQuota(username) {
            const newQuota = prompt('Enter new quota for ' + username + ':');
            if (newQuota === null) return;
            const quota = parseInt(newQuota);
            if (isNaN(quota) || quota < 1) {
                alert('Please enter a valid number!');
                return;
            }

            fetch('/api/master-update-quota', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    master_username: masterToken,
                    master_password: document.getElementById('masterPass').value,
                    username: username,
                    newQuota: quota
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('✅ Quota updated!');
                    loadAdmins();
                } else {
                    alert('Error updating quota!');
                }
            })
            .catch(() => alert('Connection error!'));
        }

        // ============================================================
        // DELETE ADMIN
        // ============================================================
        function deleteAdmin(username) {
            if (!confirm('Delete admin ' + username + '? All their keys will also be deleted.')) return;

            fetch('/api/master-delete-admin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    master_username: masterToken,
                    master_password: document.getElementById('masterPass').value,
                    username: username
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    loadAdmins();
                    loadAllKeys();
                } else {
                    alert('Error deleting admin!');
                }
            })
            .catch(() => alert('Connection error!'));
        }
    </script>
</body>
</html>
