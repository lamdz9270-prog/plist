<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configplist OptiSystem⚡️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" id="app">
        <div class="header">
            <div class="icon">⚡️</div>
            <h1>Configplist <span>OptiSystem⚡️</span></h1>
            <div class="sub">DUCLAM.NET</div>
        </div>

        <div class="glow-divider"></div>

        <!-- STEP 1: NHẬP KEY -->
        <div id="step-key">
            <div class="form-group">
                <label>🔑 License Key</label>
                <input type="text" id="keyInput" placeholder="Enter your key..." onkeydown="if(event.key==='Enter') validateKey()">
            </div>
            <button class="btn btn-primary" onclick="validateKey()" id="btnCheck">Check Key</button>
            <div id="msg" class="msg"></div>
        </div>

        <!-- STEP 2: THÔNG TIN + UDID -->
        <div id="step-udid" class="hidden">
            <div class="info-box">
                <div class="row"><span class="label">Key</span><span class="value" id="displayKey">---</span></div>
                <div class="row"><span class="label">Expires</span><span class="value" id="displayExpiry">---</span></div>
                <div class="row"><span class="label">Devices</span><span class="value" id="displayDevice">0 / 0</span></div>
                <div class="row"><span class="label">Status</span><span class="value" id="displayStatus">Available</span></div>
                <!-- 🔥 HIỂN THỊ BONUS LINK -->
                <div class="row" id="bonusRow" style="display:none;">
                    <span class="label">🎁 Bonus</span>
                    <span class="value"><a href="#" id="displayBonus" target="_blank" style="color:#00d4aa;text-decoration:none;">Download</a></span>
                </div>
            </div>

            <div style="font-size:13px;font-weight:600;color:rgba(255,255,255,0.6);margin:16px 0 4px;">Enter UDID</div>
            <div class="form-group">
                <input type="text" id="udidInput" placeholder="VD: F2LQN1234567890ABCDEF" onkeydown="if(event.key==='Enter') generateConfig()">
            </div>
            <button class="btn btn-primary" onclick="generateConfig()" id="btnDownload">Download Config</button>

            <div class="admin-contact">
                Admin: <strong id="adminName">Admin</strong> · 
                Zalo: <a href="https://zalo.me/0879072010" target="_blank" id="adminZalo">0879072010</a>
            </div>
            <div style="margin-top:10px;text-align:center;">
                <a href="#" onclick="resetApp(); return false;" style="color:rgba(255,255,255,0.2);font-size:12px;text-decoration:none;">← Enter different key</a>
            </div>
        </div>

        <div class="brand">CONFIGPLIST OPTISYSTEM ⚡️ · DUCLAM.NET</div>
    </div>

    <script>
        let currentKey = '';
        let currentKeyData = null;

        function validateKey() {
            const key = document.getElementById('keyInput').value.trim();
            const msg = document.getElementById('msg');

            if (!key) {
                msg.className = 'msg error';
                msg.textContent = 'Please enter a key';
                return;
            }

            document.getElementById('btnCheck').textContent = 'Checking...';
            document.getElementById('btnCheck').disabled = true;

            fetch('/api/validate?key=' + encodeURIComponent(key))
                .then(res => res.json())
                .then(data => {
                    if (!data.valid) {
                        msg.className = 'msg error';
                        msg.textContent = data.error || 'Invalid key';
                        document.getElementById('btnCheck').textContent = 'Check Key';
                        document.getElementById('btnCheck').disabled = false;
                        return;
                    }

                    currentKey = key;
                    currentKeyData = data.key;

                    document.getElementById('step-key').classList.add('hidden');
                    document.getElementById('step-udid').classList.remove('hidden');

                    document.getElementById('displayKey').textContent = key;
                    document.getElementById('displayExpiry').textContent = new Date(data.key.expiresAt).toLocaleDateString('vi-VN');
                    document.getElementById('displayDevice').textContent = data.key.usedDevices.length + ' / ' + data.key.maxDevices;
                    document.getElementById('displayStatus').textContent = data.key.isUsed ? '🔴 Used' : '🟢 Available';
                    document.getElementById('displayStatus').style.color = data.key.isUsed ? '#ff6b6b' : '#00d4aa';
                    document.getElementById('adminName').textContent = data.key.adminInfo.name || 'Admin';
                    document.getElementById('adminZalo').textContent = data.key.adminInfo.zalo || '0879072010';
                    document.getElementById('adminZalo').href = 'https://zalo.me/' + (data.key.adminInfo.zalo || '0879072010');

                    // 🔥 HIỂN THỊ BONUS LINK NẾU CÓ
                    const bonusRow = document.getElementById('bonusRow');
                    const bonusLink = document.getElementById('displayBonus');
                    if (data.key.bonusFile && data.key.bonusFile !== '') {
                        bonusRow.style.display = 'flex';
                        bonusLink.textContent = '📎 ' + data.key.bonusFile.substring(0, 40) + (data.key.bonusFile.length > 40 ? '...' : '');
                        bonusLink.href = data.key.bonusFile;
                    } else {
                        bonusRow.style.display = 'none';
                    }

                    document.getElementById('btnCheck').textContent = 'Check Key';
                    document.getElementById('btnCheck').disabled = false;
                    msg.className = 'msg';
                    msg.textContent = '';
                })
                .catch(() => {
                    msg.className = 'msg error';
                    msg.textContent = 'Connection error!';
                    document.getElementById('btnCheck').textContent = 'Check Key';
                    document.getElementById('btnCheck').disabled = false;
                });
        }

        function generateConfig() {
            const udid = document.getElementById('udidInput').value.trim();

            if (!udid) {
                alert('Please enter UDID');
                return;
            }
            if (!/^[0-9A-Fa-f]{40}$/.test(udid)) {
                alert('Invalid UDID (40 hex characters)');
                return;
            }

            if (currentKeyData.isUsed) {
                alert('Key already used!');
                return;
            }

            if (currentKeyData.usedDevices.find(d => d.udid === udid)) {
                alert('UDID already registered for this key!');
                return;
            }

            document.getElementById('btnDownload').textContent = 'Generating...';
            document.getElementById('btnDownload').disabled = true;

            fetch('/api/use-key', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ keyCode: currentKey, udid: udid })
            })
            .then(res => {
                if (res.status === 200) {
                    return res.blob();
                }
                return res.json().then(data => { throw new Error(data.error || 'Error generating config'); });
            })
            .then(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = currentKeyData.customConfig?.filename || 'Config.mobileconfig';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                document.getElementById('btnDownload').textContent = 'Download Config';
                document.getElementById('btnDownload').disabled = false;
                validateKey();
            })
            .catch(err => {
                alert('Error: ' + err.message);
                document.getElementById('btnDownload').textContent = 'Download Config';
                document.getElementById('btnDownload').disabled = false;
            });
        }

        function resetApp() {
            document.getElementById('step-key').classList.remove('hidden');
            document.getElementById('step-udid').classList.add('hidden');
            document.getElementById('keyInput').value = '';
            document.getElementById('udidInput').value = '';
            document.getElementById('msg').className = 'msg';
            document.getElementById('msg').textContent = '';
            currentKey = '';
            currentKeyData = null;
        }
    </script>
</body>
</html>
