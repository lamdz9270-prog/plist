<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel 🧩</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" id="app">
        <div class="header">
            <div class="icon">👑</div>
            <h1>Admin Panel</h1>
            <div class="sub">Configuration Centre</div>
        </div>

        <!-- LOGIN -->
        <div id="login-box">
            <div class="form-group">
                <label>🔑 Mật khẩu Admin</label>
                <input type="password" id="adminPass" placeholder="Nhập mật khẩu..." onkeydown="if(event.key==='Enter') adminLogin()">
            </div>
            <button class="btn" onclick="adminLogin()">Đăng nhập →</button>
            <div id="loginMsg" class="msg"></div>
        </div>

        <!-- DASHBOARD -->
        <div id="dashboard" class="hidden">
            <div class="quota">
                <span>📦 Quota key</span>
                <span><span class="used" id="keysUsed">0</span> / <span class="total" id="keyQuota">0</span></span>
            </div>

            <!-- Tạo key -->
            <div style="border-top:1px solid #2a2a3c;padding-top:16px;">
                <h2 style="font-size:16px;color:#e0e0e0;margin-bottom:12px;">➕ Tạo key mới</h2>

                <div class="form-group">
                    <label>📦 Gói</label>
                    <select id="packageSelect">
                        <option value="vip">VIP</option>
                        <option value="gold">GOLD</option>
                        <option value="free">FREE</option>
                        <option value="premium">PREMIUM</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>⏳ Thời hạn (ngày)</label>
                    <input type="number" id="expiryDays" value="365" min="1" max="9999">
                </div>

                <div class="form-group">
                    <label>📱 Số thiết bị</label>
                    <input type="number" id="maxDevices" value="1" min="1" max="999">
                </div>

                <!-- ===== CHỨC NĂNG ===== -->
                <div style="font-size:13px;font-weight:600;color:#aaa;margin:12px 0 4px;">📦 Chọn chức năng (tự động ghép code)</div>
                <div class="feature-grid">
                    <label><input type="checkbox" class="feature-chk" value="batteryOptimize"> 🔋 Tối ưu pin</label>
                    <label><input type="checkbox" class="feature-chk" value="performance"> ⚡ Tối ưu máy</label>
                    <label><input type="checkbox" class="feature-chk" value="reduceLag" checked> 🌐 Giảm lag (DNS)</label>
                    <label><input type="checkbox" class="feature-chk" value="antiLag"> 📶 Chống giật (Wi-Fi)</label>
                    <label><input type="checkbox" class="feature-chk" value="proxy"> 🔗 Tăng tốc mạng (Proxy)</label>
                    <label><input type="checkbox" class="feature-chk" value="dns"> 🌐 DNS cơ bản</label>
                    <label><input type="checkbox" class="feature-chk" value="certificate"> 📜 Chứng chỉ</label>
                </div>

                <div class="form-group">
                    <label>🌐 DNS tùy chỉnh (1 dòng 1 IP)</label>
                    <textarea id="customDns" rows="2" placeholder="1.1.1.1&#10;8.8.8.8"></textarea>
                </div>

                <button class="btn" onclick="createKey()">Tạo key →</button>
                <div id="createMsg" class="msg"></div>
            </div>

            <!-- Danh sách key -->
            <div class="key-list">
                <h2 style="font-size:16px;color:#e0e0e0;margin-bottom:10px;">📋 Danh sách key</h2>
                <div id="keyList"></div>
            </div>

            <div style="margin-top:16px;text-align:center;">
                <a href="#" onclick="adminLogout(); return false;" style="color:#555;font-size:13px;text-decoration:none;">🚪 Đăng xuất</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // ============================================================
        // ADMIN LOGIC
        // ============================================================
        let currentAdmin = null;

        function adminLogin() {
            const pass = document.getElementById('adminPass').value.trim();
            const msg = document.getElementById('loginMsg');

            const data = loadDB();
            const admin = data.admins.find(a => a.password === pass);

            if (!admin || !admin.isActive) {
                msg.className = 'msg error';
                msg.textContent = '❌ Sai mật khẩu hoặc tài khoản bị khóa!';
                return;
            }

            currentAdmin = admin;
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            msg.className = 'msg';
            msg.textContent = '';
            renderKeyList();
            updateQuota();
        }

        function adminLogout() {
            currentAdmin = null;
            document.getElementById('login-box').classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('adminPass').value = '';
        }

        function createKey() {
            const packageName = document.getElementById('packageSelect').value;
            const expiresDays = parseInt(document.getElementById('expiryDays').value) || 365;
            const maxDevices = parseInt(document.getElementById('maxDevices').value) || 1;
            const msg = document.getElementById('createMsg');

            if (!currentAdmin) {
                msg.className = 'msg error';
                msg.textContent = '❌ Vui lòng đăng nhập lại!';
                return;
            }

            // Lấy chức năng đã chọn
            const features = {};
            document.querySelectorAll('.feature-chk:checked').forEach(chk => {
                features[chk.value] = true;
            });

            // DNS tùy chỉnh
            const dnsText = document.getElementById('customDns').value.trim();
            const customDns = dnsText ? dnsText.split('\n').map(s => s.trim()).filter(s => s) : [];

            const result = createKey(
                packageName,
                expiresDays,
                maxDevices,
                features,
                customDns,
                currentAdmin.username
            );

            if (!result.success) {
                msg.className = 'msg error';
                msg.textContent = '❌ ' + result.error;
                return;
            }

            msg.className = 'msg success';
            msg.textContent = `✅ Tạo key thành công!\n🔑 Key: ${result.key.keyCode}`;

            renderKeyList();
            updateQuota();

            // Reset form
            document.getElementById('packageSelect').value = 'vip';
            document.getElementById('expiryDays').value = '365';
            document.getElementById('maxDevices').value = '1';
            document.getElementById('customDns').value = '';
            document.querySelectorAll('.feature-chk').forEach(chk => {
                chk.checked = ['reduceLag'].includes(chk.value);
            });
        }

        function renderKeyList() {
            const data = loadDB();
            const keys = data.keys.filter(k => k.createdBy === currentAdmin?.username);
            const container = document.getElementById('keyList');

            if (keys.length === 0) {
                container.innerHTML = '<div style="color:#555;text-align:center;padding:20px;">Chưa có key nào</div>';
                return;
            }

            let html = '';
            keys.forEach(k => {
                const isExpired = new Date(k.expiresAt) < new Date();
                const statusClass = isExpired ? 'expired' : 'active';
                const statusText = isExpired ? 'Hết hạn' : 'Hoạt động';

                // Hiển thị tên các chức năng đã chọn
                const featureNames = {
                    batteryOptimize: '🔋 Pin',
                    performance: '⚡ Máy',
                    reduceLag: '🌐 Giảm lag',
                    antiLag: '📶 Chống giật',
                    proxy: '🔗 Proxy',
                    dns: '🌐 DNS',
                    certificate: '📜 Chứng chỉ'
                };
                const featureList = Object.keys(k.features)
                    .filter(f => featureNames[f])
                    .map(f => featureNames[f])
                    .join(', ');

                html += `
                <div class="key-item">
                    <div>
                        <div class="code">${k.keyCode}</div>
                        <div style="font-size:11px;color:#666;margin-top:2px;">
                            ${k.package.toUpperCase()} · ${k.usedDevices.length}/${k.maxDevices} thiết bị
                            · Hết hạn: ${new Date(k.expiresAt).toLocaleDateString('vi-VN')}
                            <br>📦 ${featureList || 'Không có chức năng'}
                        </div>
                    </div>
                    <div style="display:flex;align-items:center;gap:8px;">
                        <span class="status ${statusClass}">${statusText}</span>
                        <button class="delete-btn" onclick="deleteKey('${k.keyCode}')" title="Xóa key">🗑️</button>
                    </div>
                </div>
                `;
            });
            container.innerHTML = html;
        }

        function deleteKey(keyCode) {
            if (confirm(`Xóa key ${keyCode}?`)) {
                const result = deleteKey(keyCode);
                if (result) {
                    renderKeyList();
                    updateQuota();
                }
            }
        }

        function updateQuota() {
            const data = loadDB();
            const admin = data.admins.find(a => a.username === currentAdmin?.username);
            if (admin) {
                document.getElementById('keysUsed').textContent = admin.keysUsed;
                document.getElementById('keyQuota').textContent = admin.keyQuota;
            }
        }
    </script>
</body>
</html>
