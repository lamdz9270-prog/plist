<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Configplist OptiSystem⚡️</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .ip-display {
            background: rgba(255,255,255,0.02);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            border: 1px solid rgba(255,255,255,0.04);
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .ip-display .ip-value { color: #00d4ff; font-weight: 600; }
        .login-error {
            color: #ff6b81;
            font-size: 13px;
            text-align: center;
            margin-top: 8px;
            display: none;
        }
        .login-error.show { display: block; }
        .config-preview {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 14px;
            margin-top: 12px;
            font-family: monospace;
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .config-preview .highlight {
            color: #00d4ff;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: rgba(255,255,255,0.4);
            margin-bottom: 5px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            font-size: 14px;
            color: #e0e0e0;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #7b61ff;
            background: rgba(123,97,255,0.05);
            box-shadow: 0 0 25px rgba(123,97,255,0.08);
        }
        textarea {
            min-height: 100px;
            resize: vertical;
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="header">
            <div class="icon">⚡️</div>
            <h1>Configplist OptiSystem⚡️</h1>
            <div class="sub">Admin Panel</div>
        </div>

        <!-- LOGIN -->
        <div id="login-box">
            <div class="form-group">
                <label>👤 Username</label>
                <input type="text" id="adminUser" placeholder="Enter admin username..." onkeydown="if(event.key==='Enter') adminLogin()">
            </div>
            <div class="form-group">
                <label>🔑 Password</label>
                <input type="password" id="adminPass" placeholder="Enter admin password..." onkeydown="if(event.key==='Enter') adminLogin()">
            </div>
            <button class="btn" onclick="adminLogin()">Login</button>
            <div id="loginMsg" class="login-error"></div>
        </div>

        <!-- DASHBOARD -->
        <div id="dashboard" class="hidden">
            <div class="quota">
                <span>Key Quota</span>
                <span><span class="used" id="keysUsed">0</span> / <span class="total" id="keyQuota">0</span></span>
            </div>

            <div class="ip-display">
                <span>🔒 IP Lock</span>
                <span class="ip-value" id="adminIp">Not set</span>
            </div>

            <!-- ===== TẠO KEY + TÙY CHỈNH CONFIG ===== -->
            <div style="border-top:1px solid rgba(255,255,255,0.05);padding-top:16px;">
                <h2 style="font-size:16px;color:#e0e0e0;margin-bottom:12px;">🔑 Create Key</h2>

                <div class="form-group">
                    <label>📄 Filename</label>
                    <input type="text" id="filename" value="Config.mobileconfig" placeholder="VD: Config_VIP.mobileconfig">
                </div>

                <div class="form-group">
                    <label>📛 Payload Display Name</label>
                    <input type="text" id="payloadDisplayName" value="Configplist OptiSystem⚡️" placeholder="Tên hiển thị khi cài">
                </div>

                <div class="form-group">
                    <label>📝 Payload Description</label>
                    <input type="text" id="payloadDescription" value="DUCLAM.NET" placeholder="Mô tả cấu hình">
                </div>

                <div class="form-group">
                    <label>🔗 Payload Identifier</label>
                    <input type="text" id="payloadIdentifier" value="com.duclam.config" placeholder="VD: com.duclam.config">
                </div>

                <div class="form-group">
                    <label>📦 Payload Content (XML)</label>
                    <textarea id="payloadContent" placeholder="Nội dung cấu hình...&#10;Hỗ trợ biến: {KEY}, {UDID}, {ADMIN}, {ZALO}, {DATE}"></textarea>
                    <div style="font-size:11px;color:rgba(255,255,255,0.2);margin-top:4px;">
                        💡 Biến: <code>{KEY}</code> - Key code · <code>{UDID}</code> - UDID · <code>{ADMIN}</code> - Admin name · <code>{ZALO}</code> - Zalo · <code>{DATE}</code> - Ngày tạo
                    </div>
                </div>

                <div class="form-group">
                    <label>⏳ Expiry (days)</label>
                    <input type="number" id="expiryDays" value="365" min="1" max="9999">
                </div>

                <div class="form-group">
                    <label>📱 Max Devices</label>
                    <input type="number" id="maxDevices" value="1" min="1" max="999">
                </div>

                <button class="btn" onclick="createKey()">Create Key</button>
                <div id="createMsg" class="msg"></div>
                
                <!-- Preview -->
                <div class="config-preview" id="configPreview">
                    <span style="color:rgba(255,255,255,0.2);">📄 Preview config will appear here...</span>
                </div>
            </div>

            <!-- Danh sách key -->
            <div class="key-list">
                <h2 style="font-size:16px;color:#e0e0e0;margin-bottom:10px;">📋 My Keys</h2>
                <div id="keyList"></div>
            </div>

            <div style="margin-top:16px;text-align:center;">
                <a href="#" onclick="adminLogout(); return false;" style="color:rgba(255,255,255,0.2);font-size:13px;text-decoration:none;">Logout</a>
            </div>
        </div>

        <div class="brand">CONFIGPLIST OPTISYSTEM ⚡️ · DUCLAM.NET</div>
    </div>

    <script>
        let currentAdmin = null;
        let adminIp = '';

        // ============================================================
        // ADMIN LOGIN
        // ============================================================
        function adminLogin() {
            const username = document.getElementById('adminUser').value.trim();
            const password = document.getElementById('adminPass').value.trim();
            const msg = document.getElementById('loginMsg');

            if (!username || !password) {
                msg.textContent = '⚠️ Please enter username and password!';
                msg.className = 'login-error show';
                return;
            }

            msg.className = 'login-error';
            msg.textContent = '';

            fetch('/api/admin-login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username, password: password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    currentAdmin = username;
                    adminIp = data.ip || 'Not set';
                    document.getElementById('login-box').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                    document.getElementById('adminIp').textContent = adminIp;
                    loadKeys();
                } else {
                    msg.textContent = '❌ ' + (data.error || 'Login failed!');
                    msg.className = 'login-error show';
                }
            })
            .catch(() => {
                msg.textContent = '❌ Connection error!';
                msg.className = 'login-error show';
            });
        }

        function adminLogout() {
            currentAdmin = null;
            document.getElementById('login-box').classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('adminUser').value = '';
            document.getElementById('adminPass').value = '';
        }

        // ============================================================
        // PREVIEW CONFIG
        // ============================================================
        function updatePreview() {
            const displayName = document.getElementById('payloadDisplayName').value || 'Configplist OptiSystem⚡️';
            const description = document.getElementById('payloadDescription').value || 'DUCLAM.NET';
            const identifier = document.getElementById('payloadIdentifier').value || 'com.duclam.config';
            const content = document.getElementById('payloadContent').value || '<!-- Nội dung cấu hình -->';
            
            const preview = document.getElementById('configPreview');
            preview.innerHTML = `
<span class="highlight">&lt;?xml version="1.0" encoding="UTF-8"?&gt;</span>
<span class="highlight">&lt;!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"&gt;</span>
<span class="highlight">&lt;plist version="1.0"&gt;</span>
  <span class="highlight">&lt;dict&gt;</span>
    <span style="color:#ff6b6b;">&lt;key&gt;</span>PayloadDisplayName<span style="color:#ff6b6b;">&lt;/key&gt;</span>
    <span style="color:#00d4ff;">&lt;string&gt;</span>${displayName}<span style="color:#00d4ff;">&lt;/string&gt;</span>
    <span style="color:#ff6b6b;">&lt;key&gt;</span>PayloadDescription<span style="color:#ff6b6b;">&lt;/key&gt;</span>
    <span style="color:#00d4ff;">&lt;string&gt;</span>${description}<span style="color:#00d4ff;">&lt;/string&gt;</span>
    <span style="color:#ff6b6b;">&lt;key&gt;</span>PayloadIdentifier<span style="color:#ff6b6b;">&lt;/key&gt;</span>
    <span style="color:#00d4ff;">&lt;string&gt;</span>${identifier}.{UDID}<span style="color:#00d4ff;">&lt;/string&gt;</span>
    <span style="color:#ff6b6b;">&lt;key&gt;</span>PayloadContent<span style="color:#ff6b6b;">&lt;/key&gt;</span>
    <span style="color:#00d4ff;">&lt;array&gt;</span>
      ${content.substring(0, 200)}${content.length > 200 ? '...' : ''}
    <span style="color:#00d4ff;">&lt;/array&gt;</span>
  <span class="highlight">&lt;/dict&gt;</span>
<span class="highlight">&lt;/plist&gt;</span>
            `;
        }

        // Tự động update preview khi thay đổi
        document.getElementById('payloadDisplayName').addEventListener('input', updatePreview);
        document.getElementById('payloadDescription').addEventListener('input', updatePreview);
        document.getElementById('payloadIdentifier').addEventListener('input', updatePreview);
        document.getElementById('payloadContent').addEventListener('input', updatePreview);

        // ============================================================
        // CREATE KEY
        // ============================================================
        function createKey() {
            const filename = document.getElementById('filename').value.trim() || 'Config.mobileconfig';
            const payloadDisplayName = document.getElementById('payloadDisplayName').value.trim() || 'Configplist OptiSystem⚡️';
            const payloadDescription = document.getElementById('payloadDescription').value.trim() || 'DUCLAM.NET';
            const payloadIdentifier = document.getElementById('payloadIdentifier').value.trim() || 'com.duclam.config';
            const payloadContent = document.getElementById('payloadContent').value.trim();
            const expiresDays = parseInt(document.getElementById('expiryDays').value) || 365;
            const maxDevices = parseInt(document.getElementById('maxDevices').value) || 1;
            const msg = document.getElementById('createMsg');

            if (!currentAdmin) {
                msg.className = 'msg error';
                msg.textContent = 'Please login again!';
                return;
            }

            if (!payloadContent) {
                msg.className = 'msg error';
                msg.textContent = '⚠️ Please enter Payload Content!';
                return;
            }

            fetch('/api/create-key', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + currentAdmin
                },
                body: JSON.stringify({
                    filename: filename,
                    payloadDisplayName: payloadDisplayName,
                    payloadDescription: payloadDescription,
                    payloadIdentifier: payloadIdentifier,
                    payloadContent: payloadContent,
                    expiresDays: expiresDays,
                    maxDevices: maxDevices
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    msg.className = 'msg success';
                    msg.textContent = '✅ Key created: ' + data.key.keyCode;
                    loadKeys();
                } else {
                    msg.className = 'msg error';
                    msg.textContent = data.error || 'Error creating key!';
                }
            })
            .catch(() => {
                msg.className = 'msg error';
                msg.textContent = 'Connection error!';
            });
        }

        // ============================================================
        // LOAD KEYS
        // ============================================================
        function loadKeys() {
            if (!currentAdmin) return;

            fetch('/api/keys', {
                headers: { 'Authorization': 'Bearer ' + currentAdmin }
            })
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('keyList');
                document.getElementById('keysUsed').textContent = data.used || 0;
                document.getElementById('keyQuota').textContent = data.quota || 0;

                if (!data.keys || data.keys.length === 0) {
                    container.innerHTML = '<div style="color:rgba(255,255,255,0.2);text-align:center;padding:20px;">No keys yet</div>';
                    return;
                }

                let html = '';
                data.keys.forEach(k => {
                    const isExpired = new Date(k.expiresAt) < new Date();
                    const statusClass = isExpired ? 'expired' : 'active';
                    const statusText = isExpired ? 'Expired' : 'Active';
                    const filename = k.customConfig?.filename || 'Config.mobileconfig';

                    html += `
                    <div class="key-item">
                        <div>
                            <div class="code">${k.keyCode}</div>
                            <div style="font-size:11px;color:rgba(255,255,255,0.3);margin-top:2px;">
                                📄 ${filename} · ${k.usedDevices.length}/${k.maxDevices} devices
                                · Expires: ${new Date(k.expiresAt).toLocaleDateString('vi-VN')}
                            </div>
                        </div>
                        <div style="display:flex;align-items:center;gap:8px;">
                            <span class="status ${statusClass}">${statusText}</span>
                            <button class="delete-btn" onclick="deleteKey('${k.keyCode}')" title="Delete key">🗑️</button>
                        </div>
                    </div>
                    `;
                });
                container.innerHTML = html;
            })
            .catch(() => {
                document.getElementById('keyList').innerHTML = '<div style="color:rgba(255,255,255,0.2);text-align:center;padding:20px;">Error loading keys</div>';
            });
        }

        // ============================================================
        // DELETE KEY
        // ============================================================
        function deleteKey(keyCode) {
            if (!confirm('Delete key ' + keyCode + '?')) return;

            fetch('/api/delete-key', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + currentAdmin
                },
                body: JSON.stringify({ keyCode: keyCode })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    loadKeys();
                } else {
                    alert(data.error || 'Error deleting key!');
                }
            })
            .catch(() => alert('Connection error!'));
        }

        // ============================================================
        // KHỞI TẠO
        // ============================================================
        updatePreview();
    </script>
</body>
</html>
