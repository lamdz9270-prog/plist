<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configplist OptiSystem⚡️ - Admin</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .ip-display {
            background: rgba(255,255,255,0.02);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            border: 1px solid rgba(255,255,255,0.04);
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .ip-display .ip-value { color: #00d4ff; font-weight: 600; }
        .login-error {
            color: #ff6b81;
            font-size: 13px;
            text-align: center;
            margin-top: 8px;
            display: none;
        }
        .login-error.show { display: block; }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="header">
            <div class="icon">⚡️</div>
            <h1>Configplist OptiSystem⚡️</h1>
            <div class="sub">Admin Panel</div>
        </div>

        <!-- LOGIN -->
        <div id="login-box">
            <div class="form-group">
                <label>👤 Username</label>
                <input type="text" id="adminUser" placeholder="Enter admin username..." onkeydown="if(event.key==='Enter') adminLogin()">
            </div>
            <div class="form-group">
                <label>🔑 Password</label>
                <input type="password" id="adminPass" placeholder="Enter admin password..." onkeydown="if(event.key==='Enter') adminLogin()">
            </div>
            <button class="btn" onclick="adminLogin()">Login</button>
            <div id="loginMsg" class="login-error"></div>
        </div>

        <!-- DASHBOARD -->
        <div id="dashboard" class="hidden">
            <div class="quota">
                <span>Key Quota</span>
                <span><span class="used" id="keysUsed">0</span> / <span class="total" id="keyQuota">0</span></span>
            </div>

            <div class="ip-display">
                <span>🔒 IP Lock</span>
                <span class="ip-value" id="adminIp">Not set</span>
            </div>

            <div style="border-top:1px solid rgba(255,255,255,0.05);padding-top:16px;">
                <h2 style="font-size:16px;color:#e0e0e0;margin-bottom:12px;">Create New Key</h2>

                <div class="form-group">
                    <label>Package</label>
                    <select id="packageSelect">
                        <option value="vip">VIP</option>
                        <option value="gold">GOLD</option>
                        <option value="free">FREE</option>
                        <option value="premium">PREMIUM</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Expiry (days)</label>
                    <input type="number" id="expiryDays" value="365" min="1" max="9999">
                </div>

                <div class="form-group">
                    <label>Max Devices</label>
                    <input type="number" id="maxDevices" value="1" min="1" max="999">
                </div>

                <div style="font-size:13px;font-weight:600;color:rgba(255,255,255,0.6);margin:12px 0 4px;">Features</div>
                <div class="feature-grid">
                    <label><input type="checkbox" class="feature-chk" value="battery" checked> 🔋 Battery</label>
                    <label><input type="checkbox" class="feature-chk" value="fps_boost" checked> ⚡ FPS</label>
                    <label><input type="checkbox" class="feature-chk" value="reduce_lag" checked> 🌐 DNS</label>
                    <label><input type="checkbox" class="feature-chk" value="ad_block" checked> 🚫 AdBlock</label>
                    <label><input type="checkbox" class="feature-chk" value="network_optimize"> 📶 Wi-Fi</label>
                    <label><input type="checkbox" class="feature-chk" value="ram_clean"> 🧹 RAM</label>
                    <label><input type="checkbox" class="feature-chk" value="cache_clean"> 🗑️ Cache</label>
                    <label><input type="checkbox" class="feature-chk" value="head_track"> 🎯 Head</label>
                    <label><input type="checkbox" class="feature-chk" value="fix_recoil"> 🔫 Recoil</label>
                    <label><input type="checkbox" class="feature-chk" value="light_scope"> ⚖️ Scope</label>
                    <label><input type="checkbox" class="feature-chk" value="body_track"> 🎯 Body</label>
                </div>

                <div class="form-group">
                    <label>Custom DNS (1 per line)</label>
                    <textarea id="customDns" rows="2" placeholder="1.1.1.1&#10;8.8.8.8"></textarea>
                </div>

                <button class="btn" onclick="createKey()">Create Key</button>
                <div id="createMsg" class="msg"></div>
            </div>

            <div class="key-list">
                <h2 style="font-size:16px;color:#e0e0e0;margin-bottom:10px;">My Keys</h2>
                <div id="keyList"></div>
            </div>

            <div style="margin-top:16px;text-align:center;">
                <a href="#" onclick="adminLogout(); return false;" style="color:rgba(255,255,255,0.2);font-size:13px;text-decoration:none;">Logout</a>
            </div>
        </div>

        <div class="brand">CONFIGPLIST OPTISYSTEM ⚡️ · DUCLAM.NET</div>
    </div>

    <script>
        let currentAdmin = null;
        let adminIp = '';

        function adminLogin() {
            const username = document.getElementById('adminUser').value.trim();
            const password = document.getElementById('adminPass').value.trim();
            const msg = document.getElementById('loginMsg');

            if (!username || !password) {
                msg.textContent = '⚠️ Please enter username and password!';
                msg.className = 'login-error show';
                return;
            }

            msg.className = 'login-error';
            msg.textContent = '';

            fetch('/api/admin-login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username, password: password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    currentAdmin = username;
                    adminIp = data.ip || 'Not set';
                    document.getElementById('login-box').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                    document.getElementById('adminIp').textContent = adminIp;
                    loadKeys();
                } else {
                    msg.textContent = '❌ ' + (data.error || 'Login failed!');
                    msg.className = 'login-error show';
                }
            })
            .catch(() => {
                msg.textContent = '❌ Connection error!';
                msg.className = 'login-error show';
            });
        }

        function adminLogout() {
            currentAdmin = null;
            document.getElementById('login-box').classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('adminUser').value = '';
            document.getElementById('adminPass').value = '';
        }

        function createKey() {
            const packageName = document.getElementById('packageSelect').value;
            const expiresDays = parseInt(document.getElementById('expiryDays').value) || 365;
            const maxDevices = parseInt(document.getElementById('maxDevices').value) || 1;
            const msg = document.getElementById('createMsg');

            if (!currentAdmin) {
                msg.className = 'msg error';
                msg.textContent = 'Please login again!';
                return;
            }

            const features = {};
            document.querySelectorAll('.feature-chk:checked').forEach(chk => {
                features[chk.value] = true;
            });

            const dnsText = document.getElementById('customDns').value.trim();
            const customDns = dnsText ? dnsText.split('\n').map(s => s.trim()).filter(s => s) : [];

            fetch('/api/create-key', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + currentAdmin
                },
                body: JSON.stringify({
                    package: packageName,
                    expiresDays: expiresDays,
                    maxDevices: maxDevices,
                    features: features,
                    customDns: customDns
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    msg.className = 'msg success';
                    msg.textContent = '✅ Key created: ' + data.key.keyCode;
                    loadKeys();
                } else {
                    msg.className = 'msg error';
                    msg.textContent = data.error || 'Error creating key!';
                }
            })
            .catch(() => {
                msg.className = 'msg error';
                msg.textContent = 'Connection error!';
            });
        }

        function loadKeys() {
            if (!currentAdmin) return;

            fetch('/api/keys', {
                headers: { 'Authorization': 'Bearer ' + currentAdmin }
            })
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('keyList');
                document.getElementById('keysUsed').textContent = data.used || 0;
                document.getElementById('keyQuota').textContent = data.quota || 0;

                if (!data.keys || data.keys.length === 0) {
                    container.innerHTML = '<div style="color:rgba(255,255,255,0.2);text-align:center;padding:20px;">No keys yet</div>';
                    return;
                }

                let html = '';
                data.keys.forEach(k => {
                    const isExpired = new Date(k.expiresAt) < new Date();
                    const statusClass = isExpired ? 'expired' : 'active';
                    const statusText = isExpired ? 'Expired' : 'Active';
                    const isFull = k.usedDevices.length >= k.maxDevices;
                    const fullText = isFull ? ' 🔴 Full' : '';

                    html += `
                    <div class="key-item">
                        <div>
                            <div class="code">${k.keyCode}</div>
                            <div style="font-size:11px;color:rgba(255,255,255,0.3);margin-top:2px;">
                                ${k.package.toUpperCase()} · ${k.usedDevices.length}/${k.maxDevices} devices${fullText}
                                · Expires: ${new Date(k.expiresAt).toLocaleDateString('vi-VN')}
                            </div>
                        </div>
                        <div style="display:flex;align-items:center;gap:8px;">
                            <span class="status ${statusClass}">${statusText}</span>
                            <button class="delete-btn" onclick="deleteKey('${k.keyCode}')" title="Delete key">🗑️</button>
                        </div>
                    </div>
                    `;
                });
                container.innerHTML = html;
            })
            .catch(() => {
                document.getElementById('keyList').innerHTML = '<div style="color:rgba(255,255,255,0.2);text-align:center;padding:20px;">Error loading keys</div>';
            });
        }

        function deleteKey(keyCode) {
            if (!confirm('Delete key ' + keyCode + '?')) return;

            fetch('/api/delete-key', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + currentAdmin
                },
                body: JSON.stringify({ keyCode: keyCode })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    loadKeys();
                } else {
                    alert(data.error || 'Error deleting key!');
                }
            })
            .catch(() => alert('Connection error!'));
        }
    </script>
</body>
</html>
